<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Delegate Desk Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{--ink:#1a2130;--muted:#687386;--soft:#eef1f5;--accent:#2b59c3;--ok:#157347;--warn:#b26a00;--bad:#b42318;--font:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0d1117;color:#fff;font:15px/1.4 var(--font)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:50%;top:44%;width:min(70vw,320px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);transition:border-color .2s}
.frame.ok{border-color:#3fd18b}.frame.warn{border-color:#ffb547}.frame.bad{border-color:#ff6b5e}
.top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.top b{font-size:16px}.top small{color:#cfd6e2;display:block}
.top button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:9px 12px;font:600 13px var(--font)}
.result{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:2;border-radius:18px;padding:16px 18px;background:#fff;color:var(--ink);box-shadow:0 8px 30px rgba(0,0,0,.3);transition:transform .2s}
.result .t{font-size:22px;font-weight:700}.result .n{font-size:17px;font-weight:600;margin-top:2px}.result .s{color:var(--muted);font-size:14px}
.result.ok{border-left:10px solid var(--ok)}.result.ok .t{color:var(--ok)}
.result.warn{border-left:10px solid var(--warn)}.result.warn .t{color:var(--warn)}
.result.bad{border-left:10px solid var(--bad)}.result.bad .t{color:var(--bad)}
.result.wait .t{color:var(--muted)}
.count{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 64px);z-index:2;background:rgba(0,0,0,.5);border-radius:99px;padding:6px 12px;font-size:13px}
.setup{position:fixed;inset:0;background:#f5f6f8;color:var(--ink);overflow:auto;z-index:5;display:grid;place-items:center;padding:16px}
.card{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 16px rgba(20,30,50,.06)}
h1{font-size:20px;margin:0}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
input,select{font:inherit;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:12px;padding:12px 13px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--accent);background:#fff}
.go{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px;font:600 15px var(--font)}
.err{color:var(--bad);font-size:13px;min-height:1em}
.note{color:var(--muted);font-size:12.5px;margin:0}
</style>
</head>
<body>
<div class="setup" id="setup">
  <form class="card" id="form">
    <h1>Delegate Desk Scanner</h1>
    <p class="note">Keeps the camera open and checks in every QR held up to it. Results also appear on any display set to the same station.</p>
    <label for="code">Your access code<input id="code" autocomplete="off" autocapitalize="characters" placeholder="e.g. 7KQ2MXRT" required></label>
    <label for="desk">Desk<select id="desk"><option value="Registration">Registration Desk</option><option value="Socials">Socials Desk</option></select></label>
    <label for="station">Station name (type the same on the display laptop)<input id="station" placeholder="e.g. Reg Desk 1" required></label>
    <div class="err" id="err"></div>
    <button class="go" type="submit" id="go">Start scanning</button>
  </form>
</div>

<div class="screen" id="screen" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div class="frame" id="frame"></div>
  <div class="top"><div><b id="t-station"></b><small id="t-who"></small></div><button id="stop" type="button">Settings</button></div>
  <div class="count" id="count">0 scanned</div>
  <div class="result wait" id="result"><div class="t">Ready</div><div class="s">Hold a delegate's QR code inside the square.</div></div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwUV1OyQ3u-uIew1MNsDqAGb4sP0oswIgT85JlgyjOhmesXXAW7rRrCnvwCPg5irlmJ/exec";
const $ = s => document.querySelector(s);
const ls = { get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v;}catch(_){return d;}}, set:(k,v)=>{try{localStorage.setItem(k,v);}catch(_){}} };
const st = { token:"", me:null, desk:"Registration", station:"", stream:null, timer:null, last:"", lastAt:0, queue:[], busy:false, n:0, audio:null, detector:null, wake:null };

try{localStorage.removeItem("sc-code");}catch(_){} $("#desk").value = ls.get("sc-desk","Registration"); $("#station").value = ls.get("sc-station","");

async function api(action, payload){
  const res = await fetch(API, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ token: st.token, action, payload: payload || {} }) });
  const r = await res.json();
  if (!r.ok) throw new Error(r.error === "AUTH" ? "That access code isn't valid." : r.error);
  return r.data;
}

$("#form").addEventListener("submit", async e => {
  e.preventDefault(); $("#err").textContent = ""; $("#go").disabled = true;
  st.token = $("#code").value.trim().toUpperCase(); st.desk = $("#desk").value; st.station = $("#station").value.trim();
  ensureAudio();
  try {
    const r = await api("whoami");
    st.me = r.me;
    const allowed = { Registration:["EC","REG","REGTEAM"], Socials:["EC","SOCIALS","REGTEAM"] }[st.desk];
    if (allowed.indexOf(st.me.role) < 0) throw new Error("Your role (" + st.me.roleLabel + ") can't check people in at the " + st.desk + " desk.");
    ls.set("sc-desk", st.desk); ls.set("sc-station", st.station);
    await startCamera();
  } catch (err) { $("#err").textContent = err.message || "Could not start."; }
  $("#go").disabled = false;
});

async function startCamera(){
  try {
    st.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment", width:{ideal:1280}, height:{ideal:720} }, audio:false });
  } catch (err) { throw new Error("Camera blocked. Allow camera access for this page in your browser settings, then try again."); }
  const v = $("#video"); v.srcObject = st.stream; await v.play();
  $("#setup").hidden = true; $("#screen").hidden = false;
  $("#t-station").textContent = st.station + " · " + (st.desk === "Socials" ? "Socials Desk" : "Registration Desk");
  $("#t-who").textContent = st.me.name + " · " + st.me.roleLabel;
  try { if ("BarcodeDetector" in window && (await BarcodeDetector.getSupportedFormats()).includes("qr_code")) st.detector = new BarcodeDetector({ formats:["qr_code"] }); } catch (_) {}
  try { if (navigator.wakeLock) st.wake = await navigator.wakeLock.request("screen"); } catch (_) {}
  loop();
}
function stopCamera(){
  clearTimeout(st.timer); st.timer = null;
  if (st.stream) st.stream.getTracks().forEach(t => t.stop()); st.stream = null;
  try { st.wake && st.wake.release(); } catch (_) {}
  $("#screen").hidden = true; $("#setup").hidden = false;
}
$("#stop").addEventListener("click", stopCamera);
document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible" && st.stream && navigator.wakeLock) { try { st.wake = await navigator.wakeLock.request("screen"); } catch (_) {} } });

const canvas = document.createElement("canvas"), ctx = canvas.getContext("2d", { willReadFrequently:true });
async function loop(){
  if (!st.stream) return;
  const v = $("#video");
  try {
    if (v.videoWidth) {
      let text = null;
      if (st.detector) { const codes = await st.detector.detect(v); if (codes.length) text = codes[0].rawValue; }
      else if (typeof jsQR === "function") {
        const w = 640, h = Math.round(v.videoHeight * w / v.videoWidth); canvas.width = w; canvas.height = h; ctx.drawImage(v, 0, 0, w, h);
        const r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts:"dontInvert" }); if (r) text = r.data;
      }
      if (text) onCode(text);
    }
  } catch (_) {}
  st.timer = setTimeout(loop, 120);
}

function onCode(text){
  const now = Date.now();
  if (text === st.last && now - st.lastAt < 5000) return;   // same card still in front of the camera
  st.last = text; st.lastAt = now;
  try { navigator.vibrate && navigator.vibrate(40); } catch (_) {}
  const m = String(text).match(/D-[A-Z0-9]{6}/i);
  st.queue.push({ text, id: m ? m[0].toUpperCase() : "" });
  show("wait", "Checking…", m ? m[0].toUpperCase() : "", "");
  pump();
}
async function pump(){
  if (st.busy) return; st.busy = true;
  while (st.queue.length) {
    const job = st.queue.shift();
    try {
      if (!job.id) {
        api("pushLive", { station: st.station, kind:"notfound", code: job.text, desk: st.desk }).catch(() => {});
        verdict({ outcome:"notfound" }, job); continue;
      }
      const r = await api("checkIn", { id: job.id, desk: st.desk, station: st.station });
      verdict(r, job);
    } catch (err) { show("bad", "Not saved", job.id, err.message || "Network problem. Scan again."); beep("bad"); }
  }
  st.busy = false;
}
const when = iso => iso ? new Date(iso).toLocaleString("en-PK", { day:"numeric", month:"short", hour:"numeric", minute:"2-digit" }) : "";
function verdict(r, job){
  const d = r.delegate, desk = st.desk;
  let lvl = "ok", t = "Verified", s = "";
  if (r.outcome === "notfound" || !d) { lvl = "bad"; t = "Not in our records"; s = "Don't admit. Send to the Registration Desk."; }
  else if (r.outcome === "blocked") { lvl = "bad"; t = "Entry blocked"; s = d.blockWhy || "Unpaid fines PKR " + (d.unpaid || 0).toLocaleString(); }
  else if (r.outcome === "notregistered") { lvl = "bad"; t = "Not registered yet"; s = "Send them to the Registration Desk first."; }
  else if (r.outcome === "dup") { lvl = "warn"; t = desk === "Socials" ? "Already entered today" : "Already registered"; s = when(r.at) + (r.by ? " by " + r.by : ""); }
  else { t = desk === "Socials" ? "Verified · entry recorded" : "Verified · registered"; s = (d.dgn || "") + (d.unpaid > 0 ? " · unpaid fines PKR " + d.unpaid.toLocaleString() : ""); if (d.unpaid > 0) lvl = "warn"; st.n++; $("#count").textContent = st.n + " checked in"; }
  show(lvl, t, d ? d.name : (job.text || "").slice(0, 40), s);
  beep(lvl);
}
function show(lvl, t, n, s){
  const r = $("#result"); r.className = "result " + lvl;
  r.innerHTML = '<div class="t"></div><div class="n"></div><div class="s"></div>';
  r.querySelector(".t").textContent = t; r.querySelector(".n").textContent = n || ""; r.querySelector(".s").textContent = s || "";
  const f = $("#frame"); f.className = "frame " + (lvl === "wait" ? "" : lvl);
}
function ensureAudio(){ try { if (!st.audio) st.audio = new (window.AudioContext || window.webkitAudioContext)(); if (st.audio.state === "suspended") st.audio.resume(); } catch (_) {} }
function beep(lvl){
  const a = st.audio; if (!a) return;
  const seq = { ok:[[660,.1],[990,.16]], warn:[[520,.15],[520,.15]], bad:[[200,.22],[200,.22]] }[lvl] || [];
  let t = a.currentTime + .02;
  seq.forEach(([f, d]) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .05); t += d + .06; });
}
</script>
</body>
</html>
